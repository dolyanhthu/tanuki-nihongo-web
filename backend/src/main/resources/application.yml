server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tanuki-nihongo-backend
  datasource:
    url: jdbc:h2:mem:tanukidb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  cors:
    allowed-origins: "http://localhost:5173"
